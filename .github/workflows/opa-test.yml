name: opa-test

# Synthetic reference. Not a client workflow and not an audit conclusion.
#
# Assessor: this file is the enforcing artifact. A failed job blocks merge
# only after this check is required in branch protection. Evidence is the
# run URL plus the uploaded log, not a screenshot.

on: [pull_request, push]

concurrency:
  group: opa-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  opa-test:
    name: opa-test
    # control: policy baseline / enforceable rule in git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install opa
        run: |
          set -euo pipefail
          version=1.20.2
          file=opa_linux_amd64_static
          expected="69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f"
          curl -sSfL -o "/tmp/${file}" "https://github.com/open-policy-agent/opa/releases/download/v${version}/${file}"
          echo "${expected}  /tmp/${file}" | sha256sum -c -
          chmod +x "/tmp/${file}"
          sudo install -m 0755 "/tmp/${file}" /usr/local/bin/opa
          opa version

      - name: opa test
        run: |
          set -euo pipefail
          opa test . -v 2>&1 | tee opa-test.log

      - name: Assessor note
        if: always()
        run: |
          {
            echo "## Policy baseline — enforceable rule in git"
            echo "Command: \`opa test . -v\`. Deny cases are passing tests."
            echo "A required check blocks merge. Evidence is this run URL plus the \`opa-test-log\` artifact, not a screenshot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload opa test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-test-log
          path: opa-test.log
          if-no-files-found: warn
          retention-days: 14
